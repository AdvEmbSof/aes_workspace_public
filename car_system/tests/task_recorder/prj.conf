CONFIG_ZTEST=y

# C++ support
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP17=y

# configure the stack size of ztest thread
CONFIG_ZTEST_STACK_SIZE=4096

# we use zpp_lib
CONFIG_USE_ZPP_LIB=y
CONFIG_ZPP_THREAD_POOL_SIZE=8

# disable logging
CONFIG_LOG=n
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_ZPP_RTOS_LOG_LEVEL_DBG=n
CONFIG_ZPP_DRIVERS_LOG_LEVEL_DBG=n
CONFIG_APP_LOG_LEVEL_DBG=n
CONFIG_KERNEL_LOG_LEVEL_DBG=n
CONFIG_BOOT_BANNER=n
CONFIG_TEST_LOGGING_DEFAULTS=n

# optimize for speed
CONFIG_SPEED_OPTIMIZATIONS=y

# configure thread usage
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y
