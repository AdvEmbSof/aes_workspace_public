# Enable Events API
CONFIG_EVENTS=y

# Enable random generator for testing purposes
CONFIG_TEST_RANDOM_GENERATOR=y

# Increase the stack size of the main thread to avoid stack overflow
CONFIG_MAIN_STACK_SIZE=4096

# Enable immediate logging (this prevents to create an additional thread for logging)
CONFIG_LOG_MODE_IMMEDIATE=y

# Enable work on button sleep for the WorkOnButton demo
CONFIG_WORK_ON_BUTTON_SLEEP=n

# Enable work on button use work queue for the WorkOnButton demo
CONFIG_WORK_ON_BUTTON_USE_WORK_QUEUE=y

# Define the priority of the WaitOnButton thread
# 8/9/10 correspond to PriorityAboveNormal/PriorityNormal/PriorityBelowNormal 
CONFIG_WAIT_ON_BUTTON_THREAD_PRIORITY=9

# Tells whether the WaitOnButton must be sleepy or not
CONFIG_WAIT_ON_BUTTON_SLEEP=n

# Tells to wait while updating the current time in the Clock demo
CONFIG_DISPLAY_CURRENT_TIME_WAIT=y

# Tells to add a mutex to protect the current time in the Clock demo
CONFIG_CURRENT_TIME_MUTEX=n

# Tells to add a mutex and semaphores to implement the buffer correctly
CONFIG_BUFFER_USE_MUTEX_AND_SEMAPHORE=n