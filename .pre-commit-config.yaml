files: >
  ^(blinky)|^(bme280)|^(sanitize)|^(simple_tests)$
exclude: .*\.(yaml|conf|overlay|txt|bmp|png)$|(Kconfig)|py$
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  -   id: check-yaml
      args: [--allow-multiple-documents]
  -   id: end-of-file-fixer
  -   id: trailing-whitespace
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: 'v22.1.5'
  hooks:
  -   id: clang-format
- repo: local
  hooks:
  - id: copyright
    name: Check copyright
    entry: python scripts/check_copyright.py
    language: system
    pass_filenames: true
    files: \.(c|cc|cpp|cxx|h|hpp|hxx)$    
- repo: local
  hooks:
  - id: clang-tidy
    name: clang-tidy
    entry: python scripts/run_clang_tidy.py --files
    language: system
    pass_filenames: true
    files: \.(c|cc|cpp|cxx)$